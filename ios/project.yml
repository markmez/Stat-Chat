name: StatChat
options:
  bundleIdPrefix: com.statchat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Mixpanel:
    url: https://github.com/mixpanel/mixpanel-swift
    from: "4.0.0"

targets:
  StatChat:
    type: application
    platform: iOS
    sources:
      - path: BaseballStatsEngine
        excludes:
          - "Resources/**"
      - path: BaseballStatsEngine/Resources/baseball_stats.db
        buildPhase: resources
      - path: BaseballStatsEngine/Resources/Assets.xcassets
        buildPhase: resources
      - path: BaseballStatsEngine/Resources/all_players.json
        buildPhase: resources
      - path: BaseballStatsEngine/Resources/suggestions_config.json
        buildPhase: resources
      - path: BaseballStatsEngine/Resources/StatChat.storekit
        buildPhase: resources
    dependencies:
      - package: Mixpanel
        product: Mixpanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statchat.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_NAME: StatChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
schemes:
  StatChat:
    build:
      targets:
        StatChat: all
    run:
      config: Debug
      storeKitConfiguration: BaseballStatsEngine/Resources/StatChat.storekit
