  name: Deploy Backend                                                                                               
   
  on:                                                                                                                
    push:                                                                                                          
      branches: [main]
      paths:
        - 'backend/**'
        - 'schema_description.py'
        - 'deploy/**'

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:                                                                                                         
        - name: Deploy to Lightsail
          uses: appleboy/ssh-action@v1
          env:
            APP_STORE_SERVER_API_KEY: ${{ secrets.APP_STORE_SERVER_API_KEY }}
          with:
            host: 3.223.208.21
            username: ubuntu
            key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
            envs: APP_STORE_SERVER_API_KEY
            script: |
              echo "=== DEBUG v4 (temporary) ==="
              sudo -u statchat git -C /opt/statchat/repo log --oneline -2
              echo "--- server file: lines around per-game insert block ---"
              grep -n "Inserted.*per-game\|def resolve_player\|game_split_logs\|Insert platoon splits" /opt/statchat/repo/backend/data_pipeline/pull_live_stats.py | head -12
              echo "=== END DEBUG ==="
              cd /opt/statchat/repo
              sudo -u statchat git pull
              sudo -u statchat /opt/statchat/venv/bin/pip install -q -r backend/requirements.txt
              sudo cp deploy/statchat-cron /etc/cron.d/statchat
              sudo chmod 644 /etc/cron.d/statchat
              # Ensure QE error healthcheck UUID is in env
              grep -q QE_ERROR_HC_UUID /opt/statchat/.env 2>/dev/null || \
                echo 'QE_ERROR_HC_UUID=d3f0c82b-235a-477f-8ed5-3f6ac4c6daa7' | sudo tee -a /opt/statchat/.env > /dev/null
              # Ensure App Store Connect Apple ID is in env (activates
              # Production-environment verification in /validate-receipt;
              # without this the verifier falls back to Sandbox-only).
              grep -q APP_APPLE_ID /opt/statchat/.env 2>/dev/null || \
                echo 'APP_APPLE_ID=6763139565' | sudo tee -a /opt/statchat/.env > /dev/null
              # App Store Server API credentials for the daily refund-leak
              # backstop (services/subscription_validator.revalidate_paid_devices).
              # Key ID and Issuer ID are inlined (not secrets — they only
              # identify the key, can't sign anything). The .p8 IS the secret
              # and is written from the APP_STORE_SERVER_API_KEY GitHub Secret.
              grep -q APP_STORE_KEY_ID /opt/statchat/.env 2>/dev/null || \
                echo 'APP_STORE_KEY_ID=V28MR95GA8' | sudo tee -a /opt/statchat/.env > /dev/null
              grep -q APP_STORE_ISSUER_ID /opt/statchat/.env 2>/dev/null || \
                echo 'APP_STORE_ISSUER_ID=524ee267-62fb-4c70-882d-689bd4d36e42' | sudo tee -a /opt/statchat/.env > /dev/null
              grep -q APP_STORE_PRIVATE_KEY_PATH /opt/statchat/.env 2>/dev/null || \
                echo 'APP_STORE_PRIVATE_KEY_PATH=/opt/statchat/AppStoreServerAPI.p8' | sudo tee -a /opt/statchat/.env > /dev/null
              # Write the .p8 if the secret is present. Idempotent — overwrites
              # each deploy so rotations propagate automatically.
              if [ -n "$APP_STORE_SERVER_API_KEY" ]; then
                echo "$APP_STORE_SERVER_API_KEY" | sudo tee /opt/statchat/AppStoreServerAPI.p8 > /dev/null
                sudo chown statchat:statchat /opt/statchat/AppStoreServerAPI.p8
                sudo chmod 600 /opt/statchat/AppStoreServerAPI.p8
              fi
              # Update service file. If ExecStart changed (e.g. new gunicorn flags),
              # we need a full restart — gunicorn HUP re-reads code but keeps the
              # ORIGINAL ExecStart from when the master was launched. Diff the file
              # to decide between graceful HUP (code-only change) and full restart
              # (service definition changed).
              SERVICE_CHANGED=0
              if ! sudo cmp -s deploy/statchat.service /etc/systemd/system/statchat.service; then
                SERVICE_CHANGED=1
              fi
              sudo cp deploy/statchat.service /etc/systemd/system/statchat.service
              sudo systemctl daemon-reload
              # Kill orphaned pipeline subprocesses (PPID=1) before HUP'ing gunicorn.
              # These are leftovers from a previous /admin/refresh whose gunicorn
              # worker died mid-flight (typically because of an earlier deploy).
              # Cron-launched pipelines have refresh.sh as parent (PPID != 1) and
              # are spared. Without this, orphans hold DB locks and contend with
              # subsequent crons — causing 3hr+ pipeline runtimes.
              ORPHAN_PIDS=""
              for pid in $(pgrep -f pull_live_stats.py 2>/dev/null); do
                if [ "$(ps -o ppid= -p $pid 2>/dev/null | tr -d ' ')" = "1" ]; then
                  ORPHAN_PIDS="$ORPHAN_PIDS $pid"
                fi
              done
              if [ -n "$ORPHAN_PIDS" ]; then
                echo "Killing orphan pipeline PIDs:$ORPHAN_PIDS"
                sudo kill -TERM $ORPHAN_PIDS 2>/dev/null || true
                sleep 2
                sudo kill -KILL $ORPHAN_PIDS 2>/dev/null || true
              fi
              # Always restart cleanly. Gunicorn HUP is documented to reload the
              # WSGI app for new workers when --preload is OFF (it is), but
              # empirically code changes were not picked up after HUP — debug fixes
              # to interceptor parsers stayed inert on the live backend until a
              # systemctl restart. Restart cost is ~8s downtime; correctness wins.
              sudo systemctl restart statchat
              sleep 8
              curl -sf --max-time 15 http://127.0.0.1:8000/health || {
                echo "Health check failed, checking logs..."
                sudo journalctl -u statchat --no-pager -n 30
                exit 1
              }
