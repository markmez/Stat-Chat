  name: Deploy Backend                                                                                               
   
  on:                                                                                                                
    push:                                                                                                          
      branches: [main]
      paths:
        - 'backend/**'
        - 'schema_description.py'
        - 'deploy/**'

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:                                                                                                         
        - name: Deploy to Lightsail
          uses: appleboy/ssh-action@v1                                                                               
          with:                                                                                                    
            host: 3.223.208.21
            username: ubuntu
            key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
            script: |
              cd /opt/statchat/repo
              sudo -u statchat git pull
              sudo -u statchat /opt/statchat/venv/bin/pip install -q -r backend/requirements.txt
              sudo cp deploy/statchat-cron /etc/cron.d/statchat
              sudo chmod 644 /etc/cron.d/statchat
              # Update service file if changed
              sudo cp deploy/statchat.service /etc/systemd/system/statchat.service
              sudo systemctl daemon-reload
              # Graceful reload: HUP tells gunicorn to spawn new workers before killing old
              # Falls back to hard restart if not running or first deploy with gunicorn
              if [ -f /tmp/statchat.pid ] && sudo kill -0 $(cat /tmp/statchat.pid) 2>/dev/null; then
                sudo kill -HUP $(cat /tmp/statchat.pid)
                sleep 5
              else
                sudo systemctl stop statchat 2>/dev/null || true
                sleep 1
                sudo systemctl start statchat
                sleep 8
              fi
              curl -sf --max-time 15 http://127.0.0.1:8000/health || {
                echo "Health check failed, checking logs..."
                sudo journalctl -u statchat --no-pager -n 30
                exit 1
              }
